<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARK INDUSTRIES - HUD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #030a12;
            color: #00f0ff;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* HUD Overlay Grid */
        .hud-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at center, transparent 30%, rgba(0, 15, 30, 0.8) 90%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-shadow: inset 0 0 100px rgba(0, 240, 255, 0.2);
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 240, 255, 0.4);
            padding-bottom: 10px;
            text-shadow: 0 0 10px #00f0ff;
        }

        .sys-status {
            font-size: 14px;
            letter-spacing: 2px;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        /* Center Target Arc */
        .center-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .outer-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 2px dashed rgba(0, 240, 255, 0.5);
            border-radius: 50%;
            animation: rotateRight 20s linear infinite;
        }

        .inner-ring {
            position: absolute;
            width: 70%;
            height: 70%;
            border: 3px solid transparent;
            border-top: 3px solid #00f0ff;
            border-bottom: 3px solid #00f0ff;
            border-radius: 50%;
            animation: rotateLeft 10s linear infinite;
        }

        .core-btn {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(0,240,255,0.4) 0%, rgba(0,30,60,0.8) 100%);
            border: 2px solid #00f0ff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 20px #00f0ff;
            transition: all 0.2s ease;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .core-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px #00f0ff, inset 0 0 15px #00f0ff;
            background: radial-gradient(circle, rgba(0,240,255,0.7) 0%, rgba(0,50,100,0.9) 100%);
        }

        .core-btn:active {
            transform: scale(0.95);
        }

        /* Target Lock Effect */
        .target-lock {
            position: absolute;
            width: 140%;
            height: 140%;
            border: 1px solid rgba(255, 50, 50, 0);
            border-radius: 50%;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .target-lock.active {
            border: 2px solid #ff3333;
            box-shadow: 0 0 30px #ff3333;
            animation: pulseTarget 0.6s infinite alternate;
        }

        /* Bottom Status Panel */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 2px solid rgba(0, 240, 255, 0.4);
            padding-top: 10px;
        }

        .log-box {
            font-family: monospace;
            font-size: 12px;
            max-height: 80px;
            overflow-y: hidden;
            color: rgba(0, 240, 255, 0.8);
        }

        /* Animations */
        @keyframes rotateRight {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes rotateLeft {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        @keyframes pulseTarget {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="sys-status">SYS.LOC: ONLINE | MARK VII</div>
            <div class="title">STARK INDUSTRIES</div>
            <div class="sys-status" id="clock">00:00:00</div>
        </div>

        <!-- Central Interactive Arc Reactor HUD -->
        <div class="center-hud">
            <div class="outer-ring"></div>
            <div class="inner-ring"></div>
            <div class="target-lock" id="targetLock"></div>
            <button class="core-btn" id="fireBtn">ENGAGE<br>TARGET</button>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="log-box" id="logBox">
                [SYSTEM] INITIALIZING HUD INTERFACE...<br>
                [SYSTEM] JARVIS CORE CONNECTED.<br>
                [READY] WAITING FOR TARGET SELECTION...
            </div>
            <div class="sys-status">POWER: 100% | REPULSOR: READY</div>
        </div>
    </div>

    <script>
        // Realtime Clock
        function updateClock() {
            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            document.getElementById('clock').innerText = timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Target Engagement Logic
        const fireBtn = document.getElementById('fireBtn');
        const targetLock = document.getElementById('targetLock');
        const logBox = document.getElementById('logBox');

        function addLog(msg) {
            const line = document.createElement('div');
            line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(line);
            if (logBox.children.length > 4) {
                logBox.removeChild(logBox.firstChild);
            }
        }

        let isLocked = false;

        fireBtn.addEventListener('click', () => {
            if (!isLocked) {
                isLocked = true;
                targetLock.classList.add('active');
                fireBtn.style.borderColor = '#ff3333';
                fireBtn.style.color = '#ff3333';
                fireBtn.innerHTML = 'TARGET<br>LOCKED';
                addLog('WARNING: TARGET LOCKED ON!');
            } else {
                isLocked = false;
                targetLock.classList.remove('active');
                fireBtn.style.borderColor = '#00f0ff';
                fireBtn.style.color = '#ffffff';
                fireBtn.innerHTML = 'ENGAGE<br>TARGET';
                addLog('SYSTEM: REPULSOR DISARMED.');
            }
        });
    </script>
</body>
</html>
