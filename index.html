<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARK INDUSTRIES - HUD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030a12;
            color: #00f0ff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hud-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at center, transparent 30%, rgba(0, 15, 30, 0.95) 90%),
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-shadow: inset 0 0 80px rgba(0, 240, 255, 0.25);
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 240, 255, 0.4);
            padding-bottom: 8px;
            text-shadow: 0 0 10px #00f0ff;
            z-index: 10;
        }

        .sys-status {
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            text-align: center;
        }

        /* Wheel / HUD Container */
        .center-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        /* Target Indicator Pin at Top of Wheel */
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #ff3333;
            filter: drop-shadow(0 0 8px #ff3333);
            z-index: 20;
        }

        /* Canvas Wheel */
        #wheelCanvas {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.15, 1);
        }

        /* Central Trigger Button */
        .core-btn {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, rgba(0,240,255,0.9) 0%, rgba(0,30,60,0.95) 100%);
            border: 3px solid #00f0ff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 25px #00f0ff, inset 0 0 15px #00f0ff;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 25;
            user-select: none;
        }

        .core-btn:active {
            transform: scale(0.92);
        }

        /* Modal Popup Overlay */
        .modal-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 10, 18, 0.92);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-box {
            position: relative;
            width: 90%;
            max-width: 420px;
            padding: 30px 20px;
            background: rgba(5, 20, 35, 0.95);
            border: 2px solid #00f0ff;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.15);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .modal-box.shot-theme {
            border-color: #ff3333;
            box-shadow: 0 0 40px rgba(255, 51, 51, 0.4), inset 0 0 20px rgba(255, 51, 51, 0.2);
        }

        /* Tech corner brackets */
        .modal-box::before, .modal-box::after {
            content: '';
            position: absolute;
            width: 15px;
            height: 15px;
            border-color: inherit;
            border-style: solid;
        }
        .modal-box::before { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
        .modal-box::after { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

        .modal-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 26px;
            box-shadow: 0 0 15px currentColor;
        }

        .modal-subtitle {
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        .modal-title {
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .modal-text {
            font-size: 14px;
            line-height: 1.5;
            padding: 0 10px;
        }

        .accept-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0088ff, #00f0ff);
            border: none;
            border-radius: 6px;
            color: #030a12;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 2px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .accept-btn:active {
            transform: scale(0.97);
        }

        /* Bottom Status Panel */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 2px solid rgba(0, 240, 255, 0.4);
            padding-top: 8px;
            z-index: 10;
        }

        .log-box {
            font-family: monospace;
            font-size: 10px;
            max-height: 60px;
            overflow: hidden;
            color: rgba(0, 240, 255, 0.85);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="sys-status">SYS.STATUS: ONLINE<br>MARK VII</div>
            <div class="title">STARK<br>INDUSTRIES</div>
            <div class="sys-status" id="clock">00:00:00</div>
        </div>

        <!-- Central Wheel HUD -->
        <div class="center-hud">
            <div class="wheel-pointer"></div>
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
            <button class="core-btn" id="spinBtn">DREHEN</button>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="log-box" id="logBox">
                [JARVIS] HUD v4.0 Kalibriert.<br>
                [SYSTEM] 10-Segment-Rad (5x SHOT / 5x SAFE).<br>
                [BEREIT] Drücke DREHEN für Scan.
            </div>
            <div class="sys-status" style="text-align: right;">ENERGIE: 100%<br>REPULSOR: BEREIT</div>
        </div>
    </div>

    <!-- Result Modal Overlay -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-box" id="modalBox">
            <div class="modal-icon" id="modalIcon">⚡</div>
            <div>
                <div class="modal-subtitle" id="modalSub">WARNUNG // STARK PROTOKOLL</div>
                <div class="modal-title" id="modalHeading">SHOT</div>
            </div>
            <div class="modal-text" id="modalText">Systemüberlastung! Ab an die Bar und einen Shot trinken.</div>
            <button class="accept-btn" id="acceptBtn">AKZEPTIEREN & BESTÄTIGEN</button>
        </div>
    </div>

    <script>
        // Realtime Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Audio Effects (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // Exactly 10 Segments: 5x SHOT (Red) & 5x KEIN SHOT (Blue) strictly alternating
        const segments = [
            { text: "SHOT", type: "shot", color: "#ff3333" },
            { text: "KEIN SHOT", type: "safe", color: "#00f0ff" },
            { text: "SHOT", type: "shot", color: "#ff3333" },
            { text: "KEIN SHOT", type: "safe", color: "#00f0ff" },
            { text: "SHOT", type: "shot", color: "#ff3333" },
            { text: "KEIN SHOT", type: "safe", color: "#00f0ff" },
            { text: "SHOT", type: "shot", color: "#ff3333" },
            { text: "KEIN SHOT", type: "safe", color: "#00f0ff" },
            { text: "SHOT", type: "shot", color: "#ff3333" },
            { text: "KEIN SHOT", type: "safe", color: "#00f0ff" }
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numSegments = segments.length;
        const arcSize = (2 * Math.PI) / numSegments;

        // Draw Wheel with larger text
        function drawWheel() {
            ctx.clearRect(0, 0, 600, 600);
            const cx = 300, cy = 300, r = 280;

            for (let i = 0; i < numSegments; i++) {
                const angle = i * arcSize - Math.PI / 2;
                
                // Segment Fill & Border
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, angle, angle + arcSize);
                ctx.fillStyle = segments[i].type === 'shot' ? "rgba(70, 10, 10, 0.9)" : "rgba(3, 25, 45, 0.9)";
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = segments[i].color;
                ctx.stroke();

                // Inner Tech Arc Line
                ctx.beginPath();
                ctx.arc(cx, cy, r - 25, angle, angle + arcSize);
                ctx.strokeStyle = segments[i].color;
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Text Formatting (Larger font size: 20px)
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = segments[i].color;
                ctx.font = "bold 20px 'Segoe UI', sans-serif";
                ctx.shadowColor = segments[i].color;
                ctx.shadowBlur = 10;
                ctx.fillText(segments[i].text, r - 35, 7);
                ctx.restore();
            }
        }
        drawWheel();

        // Funny Quotes / Messages
        const shotQuotes = [
            "Systemüberlastung! Ab an die Bar und einen Shot trinken.",
            "Energie-Repulsor aufgeladen! Trinke jetzt sofort einen Shot.",
            "Tony Stark befugt dich hiermit zu exzessivem Alkoholkonsum.",
            "Fehler 404: Nüchternheit nicht gefunden. Genieß den Shot!"
        ];

        const safeQuotes = [
            "J.A.R.V.I.S. gewährt dir Immunität. Du musst keinen Shot nehmen.",
            "Leber-Schutzschild aktiv! Heute kommst du nochmal davon.",
            "Protokoll 'Couch-Potato' aktiviert: Keine Action an der Bar.",
            "Glück gehabt! Pepper Potts erlaubt dir diesen Durchgang zu überspringen."
        ];

        // Spin Logic with exact 100% synchronized pointer detection
        const spinBtn = document.getElementById('spinBtn');
        const resultModal = document.getElementById('resultModal');
        const modalBox = document.getElementById('modalBox');
        const modalIcon = document.getElementById('modalIcon');
        const modalSub = document.getElementById('modalSub');
        const modalHeading = document.getElementById('modalHeading');
        const modalText = document.getElementById('modalText');
        const acceptBtn = document.getElementById('acceptBtn');
        const logBox = document.getElementById('logBox');

        let currentRotation = 0;
        let isSpinning = false;

        function addLog(msg) {
            const line = document.createElement('div');
            line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(line);
            if (logBox.children.length > 4) {
                logBox.removeChild(logBox.firstChild);
            }
        }

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            
            playSound(600, 'triangle', 0.2);
            addLog("SCAN LÄUFT: RAD DREHT SICH...");

            // Random rotation (min 5 full rotations + random offset)
            const extraDegrees = Math.floor(Math.random() * 360) + 1800;
            currentRotation += extraDegrees;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Sound Ticks during spin
            let tickCount = 0;
            const tickInterval = setInterval(() => {
                playSound(300 + (tickCount % 5) * 50, 'sine', 0.05);
                tickCount++;
                if (tickCount > 25) clearInterval(tickInterval);
            }, 120);

            // Finish after 4s animation
            setTimeout(() => {
                isSpinning = false;
                clearInterval(tickInterval);

                // Precise angle normalization for top-pointing indicator
                const normalizedDeg = currentRotation % 360;
                const degreesPerSegment = 360 / numSegments;
                // Clockwise offset correction for top indicator position
                const pointerAngle = (360 - normalizedDeg) % 360;
                const segmentIndex = Math.floor(pointerAngle / degreesPerSegment) % numSegments;

                const selected = segments[segmentIndex];

                // Configure and show Modal Popup based on exact segment type
                if (selected.type === 'shot') {
                    modalBox.className = "modal-box shot-theme";
                    modalIcon.innerText = "⚡";
                    modalIcon.style.color = "#ff3333";
                    modalSub.innerText = "WARNUNG // STARK PROTOKOLL";
                    modalHeading.innerText = "SHOT";
                    modalHeading.style.color = "#ff3333";
                    modalText.innerText = shotQuotes[Math.floor(Math.random() * shotQuotes.length)];
                    playSound(150, 'sawtooth', 0.6);
                    addLog("ZIEL ERFASST: ROT -> SHOT!");
                } else {
                    modalBox.className = "modal-box";
                    modalIcon.innerText = "🛡️";
                    modalIcon.style.color = "#00f0ff";
                    modalSub.innerText = "IMMUNITÄT // FREIGABE";
                    modalHeading.innerText = "KEIN SHOT";
                    modalHeading.style.color = "#00f0ff";
                    modalText.innerText = safeQuotes[Math.floor(Math.random() * safeQuotes.length)];
                    playSound(880, 'square', 0.4);
                    addLog("ZIEL ERFASST: BLAU -> KEIN SHOT.");
                }

                resultModal.classList.add('active');

            }, 4000);
        });

        // Close modal and reset for next spin
        acceptBtn.addEventListener('click', () => {
            resultModal.classList.remove('active');
            playSound(700, 'sine', 0.1);
            addLog("SYSTEM BEREIT FÜR NÄCHSTEN DREH.");
        });
    </script>
</body>
</html>
