<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STARK INDUSTRIES - HUD</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #030a12;
            color: #00f0ff;
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .hud-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at center, transparent 30%, rgba(0, 15, 30, 0.95) 90%),
                linear-gradient(rgba(0, 240, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-shadow: inset 0 0 80px rgba(0, 240, 255, 0.25);
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid rgba(0, 240, 255, 0.4);
            padding-bottom: 8px;
            text-shadow: 0 0 10px #00f0ff;
            z-index: 10;
        }

        .sys-status {
            font-size: 11px;
            letter-spacing: 1.5px;
        }

        .title {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 3px;
            text-align: center;
        }

        /* Wheel / HUD Container */
        .center-hud {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 320px;
            height: 320px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        /* Target Indicator Pin at Top of Wheel */
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 20px solid #ff3333;
            filter: drop-shadow(0 0 8px #ff3333);
            z-index: 20;
        }

        /* Canvas Wheel */
        #wheelCanvas {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.4);
            transition: transform 4s cubic-bezier(0.15, 0.99, 0.15, 1);
        }

        /* Central Trigger Button */
        .core-btn {
            position: absolute;
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, rgba(0,240,255,0.9) 0%, rgba(0,30,60,0.95) 100%);
            border: 3px solid #00f0ff;
            border-radius: 50%;
            color: #fff;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 25px #00f0ff, inset 0 0 15px #00f0ff;
            outline: none;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 25;
            user-select: none;
        }

        .core-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 40px #00f0ff, inset 0 0 25px #00f0ff;
        }

        /* Result Display Overlay */
        .result-display {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: bold;
            color: #00f0ff;
            text-shadow: 0 0 12px #00f0ff;
            letter-spacing: 2px;
            text-align: center;
            z-index: 10;
            min-height: 28px;
            transition: all 0.3s ease;
        }

        /* Target Lock Animation Frame */
        .target-lock-ring {
            position: absolute;
            width: 340px;
            height: 340px;
            border: 2px dashed rgba(255, 51, 51, 0);
            border-radius: 50%;
            pointer-events: none;
            z-index: 15;
            transition: all 0.3s ease;
        }

        .target-lock-ring.active {
            border-color: #ff3333;
            box-shadow: 0 0 30px #ff3333, inset 0 0 20px #ff3333;
            animation: pulseTarget 0.5s infinite alternate;
        }

        @keyframes pulseTarget {
            from { transform: scale(1); opacity: 0.8; }
            to { transform: scale(1.04); opacity: 1; }
        }

        /* Bottom Status Panel */
        .bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-top: 2px solid rgba(0, 240, 255, 0.4);
            padding-top: 8px;
            z-index: 10;
        }

        .log-box {
            font-family: monospace;
            font-size: 10px;
            max-height: 60px;
            overflow: hidden;
            color: rgba(0, 240, 255, 0.85);
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="hud-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="sys-status">SYS.STATUS: ONLINE<br>MARK VII</div>
            <div class="title">STARK<br>INDUSTRIES</div>
            <div class="sys-status" id="clock">00:00:00</div>
        </div>

        <div class="result-display" id="resultText">SYSTEM BEREIT</div>

        <!-- Central Wheel HUD -->
        <div class="center-hud">
            <div class="wheel-pointer"></div>
            <div class="target-lock-ring" id="targetLockRing"></div>
            <canvas id="wheelCanvas" width="600" height="600"></canvas>
            <button class="core-btn" id="spinBtn">DREHEN</button>
        </div>

        <!-- Bottom Bar -->
        <div class="bottom-bar">
            <div class="log-box" id="logBox">
                [JARVIS] HUD v2.0 Initalisiert.<br>
                [SYSTEM] Alle Systeme bereit.<br>
                [BEREIT] Drücke DREHEN für Zielauswahl.
            </div>
            <div class="sys-status" style="text-align: right;">ENERGIE: 100%<br>REPULSOR: BEREIT</div>
        </div>
    </div>

    <script>
        // Realtime Clock
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toTimeString().split(' ')[0];
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Audio Effects (Web Audio API)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type || 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        // 2 Options: SHOT vs. KEIN SHOT
        const options = ["SHOT!", "KEIN SHOT"];
        const colors = ["#ff3333", "#00f0ff"];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const numOptions = options.length;
        const arcSize = (2 * Math.PI) / numOptions;

        // Draw Wheel (Split in 2 halfs)
        function drawWheel() {
            ctx.clearRect(0, 0, 600, 600);
            const cx = 300, cy = 300, r = 280;

            for (let i = 0; i < numOptions; i++) {
                const angle = i * arcSize - Math.PI / 2;
                
                // Segment Fill & Border
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, angle, angle + arcSize);
                ctx.fillStyle = i === 0 ? "rgba(60, 10, 10, 0.85)" : "rgba(3, 20, 40, 0.85)";
                ctx.fill();
                ctx.lineWidth = 5;
                ctx.strokeStyle = colors[i];
                ctx.stroke();

                // Inner Tech Line
                ctx.beginPath();
                ctx.arc(cx, cy, r - 15, angle, angle + arcSize);
                ctx.strokeStyle = colors[i];
                ctx.lineWidth = 2;
                ctx.stroke();

                // Text Formatting
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "center";
                ctx.fillStyle = colors[i];
                ctx.font = "bold 34px 'Segoe UI', sans-serif";
                ctx.shadowColor = colors[i];
                ctx.shadowBlur = 15;
                ctx.fillText(options[i], r / 1.6, 12);
                ctx.restore();
            }
        }
        drawWheel();

        // Spin Logic & Lock Animation
        const spinBtn = document.getElementById('spinBtn');
        const resultText = document.getElementById('resultText');
        const targetLockRing = document.getElementById('targetLockRing');
        const logBox = document.getElementById('logBox');
        let currentRotation = 0;
        let isSpinning = false;

        function addLog(msg) {
            const line = document.createElement('div');
            line.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logBox.appendChild(line);
            if (logBox.children.length > 4) {
                logBox.removeChild(logBox.firstChild);
            }
        }

        spinBtn.addEventListener('click', () => {
            if (isSpinning) return;
            isSpinning = true;
            
            targetLockRing.classList.remove('active');
            playSound(600, 'triangle', 0.2);
            resultText.innerText = "BERECHNE ZIEL...";
            resultText.style.color = "#00f0ff";
            resultText.style.textShadow = "0 0 12px #00f0ff";
            addLog("ANALYSIS ANGESTOSSEN...");

            // Random rotation (min 5 full rotations)
            const extraDegrees = Math.floor(Math.random() * 360) + 1800;
            currentRotation += extraDegrees;
            canvas.style.transform = `rotate(${currentRotation}deg)`;

            // Sound Ticks during spin
            let tickCount = 0;
            const tickInterval = setInterval(() => {
                playSound(350 + (tickCount % 4) * 60, 'sine', 0.05);
                tickCount++;
                if (tickCount > 25) clearInterval(tickInterval);
            }, 120);

            // Finish after 4s animation
            setTimeout(() => {
                isSpinning = false;
                clearInterval(tickInterval);

                const actualDeg = currentRotation % 360;
                const relativeDeg = (360 - actualDeg + 270) % 360;
                const index = Math.floor(relativeDeg / (360 / numOptions)) % numOptions;

                const winner = options[index];

                // Target Lock FX
                targetLockRing.classList.add('active');
                
                if (index === 0) { // SHOT!
                    resultText.innerText = "ZIEL ERFASST: SHOT!";
                    resultText.style.color = "#ff3333";
                    resultText.style.textShadow = "0 0 20px #ff3333";
                    playSound(150, 'sawtooth', 0.6); // Heavy Lock Sound
                    addLog("WARNUNG: SHOT ERFORDERLICH!");
                } else { // KEIN SHOT
                    resultText.innerText = "ZIEL ERFASST: KEIN SHOT";
                    resultText.style.color = "#00f0ff";
                    resultText.style.textShadow = "0 0 20px #00f0ff";
                    playSound(880, 'square', 0.4); // High Pitch Lock Sound
                    addLog("STATUS: ENTWARNUNG, KEIN SHOT.");
                }

            }, 4000);
        });
    </script>
</body>
</html>
